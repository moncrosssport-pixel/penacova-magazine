<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Form inputs</title>
<link rel="stylesheet" href="_card.css" />
<style>
  .stack { display: flex; flex-direction: column; gap: 16px; max-width: 500px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .lbl { font-family: var(--font-sans); font-weight: 600; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gray-500); }
  .inp { font-family: var(--font-serif); font-size: 16px; padding: 10px 0; background: transparent; border: 0; border-bottom: 1px solid var(--ink); color: var(--ink); outline: none; }
  .inp::placeholder { color: var(--gray-300); font-style: italic; }
  .helper { font-family: var(--font-serif); font-style: italic; font-size: 12px; color: var(--ink-mute); line-height: 1.5; }
  .row { display: flex; gap: 12px; align-items: flex-end; }
  .row .field { flex: 1; }
  .submit { font-family: var(--font-sans); font-weight: 600; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; padding: 10px 18px; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <span class="label">Form inputs — underline only, no boxes</span>
    <div class="stack">
      <div class="row">
        <div class="field">
          <span class="lbl">Email</span>
          <input class="inp" placeholder="reader@example.com" />
        </div>
        <button class="submit">Subscribe</button>
      </div>
      <p class="helper">Receive the next issue. One email per month.</p>
    </div>
  </div>
</body>
</html>
