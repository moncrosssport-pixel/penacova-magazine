<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Iconography — typographic glyphs</title>
<link rel="stylesheet" href="_card.css" />
<style>
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .g { aspect-ratio: 1 / 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid var(--gray-200); background: var(--paper-pure); gap: 4px; }
  .glyph { font-family: var(--font-display); font-size: 28px; color: var(--ink); line-height: 1; }
  .gname { font-family: var(--font-mono); font-size: 10px; color: var(--gray-500); }
  .note { font-family: var(--font-serif); font-style: italic; font-size: 12px; color: var(--ink-mute); line-height: 1.5; }
</style>
</head>
<body>
  <div class="card">
    <span class="label">Iconography — glyphs do the icon work, no emoji</span>
    <div class="grid">
      <div class="g"><span class="glyph">→</span><span class="gname">more</span></div>
      <div class="g"><span class="glyph">←</span><span class="gname">back</span></div>
      <div class="g"><span class="glyph">×</span><span class="gname">close</span></div>
      <div class="g"><span class="glyph">№</span><span class="gname">issue</span></div>
      <div class="g"><span class="glyph">※</span><span class="gname">break</span></div>
      <div class="g"><span class="glyph">•</span><span class="gname">dot</span></div>
      <div class="g"><span class="glyph">✕</span><span class="gname">clear</span></div>
    </div>
    <p class="note">No icon font, no SVG icon set. Typographic glyphs and words handle navigation. If a future surface truly needs an icon (e.g. video play), use Lucide stroke 1.25 — flagged as substitute.</p>
  </div>
</body>
</html>
